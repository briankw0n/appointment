<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Appointments</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui; padding: 16px; max-width: 420px; margin: auto; }
    input, button { width: 100%; padding: 12px; margin-top: 8px; font-size: 16px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-top: 10px; word-wrap: break-word; }
    .pending { background: #fff3cd; }
    .accepted { background: #d1e7dd; }
    .rejected { background: #f8d7da; }
    .button-group { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .button-group button { flex: 1; min-width: 80px; }
  </style>
</head>
<body>

<h2>Request Appointment</h2>
<input type="date" id="date">
<input type="time" id="time">
<button id="requestBtn">Request</button>

<h2>Appointments</h2>
<div id="list"></div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

  const supabase = createClient(
    "https://geovhaihpvrxojxltksa.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdlb3ZoYWlocHZyeG9qeGx0a3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgyNTQ5MTMsImV4cCI6MjA4MzgzMDkxM30.ZpiLjOIdn6s3g-HnZiawDgoS98Qmb8XG0ulHCpGuxMg"
  );

  async function add() {
    const dateInput = document.getElementById('date')
    const timeInput = document.getElementById('time')
    if (!dateInput.value || !timeInput.value) return alert("Pick date & time")

    await supabase.from("appointments").insert({
      date: dateInput.value,
      time: timeInput.value,
      status: "pending"
    })

    load()
  }

  async function load() {
    const { data, error } = await supabase
      .from("appointments")
      .select("id, date, time, status")
      .order("created_at", { ascending: false })

    if (error) { console.error(error); return }

    const listDiv = document.getElementById('list')
    listDiv.innerHTML = ""

    data.forEach(a => {
      const card = document.createElement('div')
      card.className = `card ${a.status}`
      card.innerHTML = `<b>${a.date} ${a.time}</b><br>Status: ${a.status}`

      const buttonGroup = document.createElement('div')
      buttonGroup.className = 'button-group'

      const acceptBtn = document.createElement('button')
      acceptBtn.textContent = 'Accept'
      acceptBtn.onclick = () => set(a.id, 'accepted')
      buttonGroup.appendChild(acceptBtn)

      const rejectBtn = document.createElement('button')
      rejectBtn.textContent = 'Reject'
      rejectBtn.onclick = () => set(a.id, 'rejected')
      buttonGroup.appendChild(rejectBtn)

      const deleteBtn = document.createElement('button')
      deleteBtn.textContent = 'Delete'
      deleteBtn.onclick = () => remove(a.id)
      deleteBtn.style.background = '#f44336'; // red
      deleteBtn.style.color = '#fff';
      buttonGroup.appendChild(deleteBtn)

      card.appendChild(buttonGroup)
      listDiv.appendChild(card)
    })
  }

  async function set(id, status) {
    await supabase.from("appointments").update({ status }).eq("id", id)
    load()
  }

  async function remove(id) {
    if (!confirm("Delete this appointment?")) return
    await supabase.from("appointments").delete().eq("id", id)
    load()
  }

  document.getElementById('requestBtn').addEventListener('click', add)
  load()
</script>

</body>
</html>
